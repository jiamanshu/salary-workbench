</style></head><body><div class="mobilebar"><strong>☁️ 工资工作台</strong><button class="btn small" id="openNav">☰ 人员菜单</button></div><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">☁</div><div><strong>工资工作台</strong><small>Salary Studio · 离线版</small></div></div><div class="nav" id="nav"></div><div class="navtools"><button class="btn primary" id="addStaff">＋ 新增工作人员</button><button class="btn white" id="exportBackup">↓ 导出数据备份</button><button class="btn white" id="importBackup">↑ 导入数据备份</button><input type="file" id="backupFile" accept=".json,application/json" hidden></div><div class="sidefoot">数据仅保存在本机浏览器，请定期备份。</div></aside><main class="main" id="main"></main></div><div id="modalRoot"></div><script>
(()=>{'use strict';const KEY='macaron_salary_v3';const $=s=>document.querySelector(s);const money=n=>'¥ '+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const currentMonth=()=>today().slice(0,7);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto?.randomUUID?.()||String(Date.now())+Math.random();const validAmount=n=>Number.isFinite(n)&&n>0&&Math.abs(n*100-Math.round(n*100))<1e-6;let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!db||!Array.isArray(db.staff)||!Array.isArray(db.records))db={staff:[],records:[]};let selected='overview',month=currentMonth(),calendarMode=false,selectedDay=today();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('保存失败：浏览器存储空间不足或禁用了本地存储。请先导出备份。')}};const staffBy=id=>db.staff.find(x=>x.id===id);const monthRecords=(id,m)=>db.records.filter(r=>(!id||r.staffId===id)&&r.date.slice(0,7)===m);const total=arr=>Math.round(arr.reduce((s,r)=>s+Number(r.amount),0)*100)/100;const monthName=m=>m.replace('-','年')+'月';const closeNav=()=>$('#sidebar').classList.remove('open');const button=(label,action,cls='white')=>`<button class="btn ${cls}" data-act="${action}">${label}</button>`;const monthInput=()=>`<input class="month" type="month" id="monthPick" value="${month}">`;const nav=()=>{$('#nav').innerHTML=`<div class="navitem ${selected==='overview'?'active':''}"><button class="navname" data-view="overview">▦ &nbsp; 工资总览</button></div><div class="sidehead"><span>工作人员 · ${db.staff.length}</span></div>`+db.staff.map((s,i)=>`<div class="navitem ${selected===s.id?'active':''}"><button class="navname" data-view="${esc(s.id)}">${['●','◆','✿','◉','✦'][i%5]} &nbsp;${esc(s.name)}</button><button class="navcal" title="选择月份" data-cal="${esc(s.id)}">▦</button><button class="navmenu" title="重命名或删除" data-menu="${esc(s.id)}">⋯</button></div>`).join('')};const stat=(a,b,c)=>`<div class="stat"><label>${a}</label><b>${b}</b>${c?`<span class="tiny">${c}</span>`:''}</div>`;const yearTotals=()=>{let year=month.slice(0,4);return `<div class="panel"><div class="paneltop"><h2>${year} 年 · 全员月度工资</h2><span class="tiny">点击金额查看该月</span></div><div class="tablewrap"><table><thead><tr><th>工作人员</th>${Array.from({length:12},(_,i)=>`<th>${i+1}月</th>`).join('')}<th>年度合计</th></tr></thead><tbody>${db.staff.map(s=>`<tr><td>${esc(s.name)}</td>${Array.from({length:12},(_,i)=>{let m=year+'-'+String(i+1).padStart(2,'0');return `<td><button class="btn small white" data-jump="${m}" data-person="${esc(s.id)}">${money(total(monthRecords(s.id,m)))}</button></td>`}).join('')}<td class="money">${money(total(db.records.filter(r=>r.staffId===s.id&&r.date.startsWith(year))))}</td></tr>`).join('')||'<tr><td colspan="14" class="empty">暂无工作人员，请先新增。</td></tr>'}</tbody></table></div></div>`};const overview=()=>{let all=monthRecords(null,month),active=db.staff.filter(s=>monthRecords(s.id,month).length);return `<div class="top"><div><h1>工资总览</h1><p class="sub">清晰掌握每一笔工资记录</p></div><div class="actions"><span class="tiny">查看月份</span>${monthInput()}</div></div><div class="cards">${stat('当月工资总额',money(total(all)))}${stat('工作人员',db.staff.length+' 人')}${stat('本月有记录',active.length+' 人')}</div><div class="panel"><div class="paneltop"><h2>${monthName(month)} · 工资汇总</h2><span class="pill">自动统计</span></div><div class="tablewrap"><table><thead><tr><th>工作人员</th><th>记录笔数</th><th>月度工资</th><th>操作</th></tr></thead><tbody>${db.staff.map(s=>{let r=monthRecords(s.id,month);return `<tr><td>${esc(s.name)}</td><td>${r.length}</td><td class="money">${money(total(r))}</td><td><button class="btn small" data-view="${esc(s.id)}">查看月表</button></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">点击左侧“新增工作人员”开始使用。</td></tr>'}</tbody><tfoot><tr><td>全员合计</td><td>${all.length} 笔</td><td>${money(total(all))}</td><td></td></tr></tfoot></table></div></div>${yearTotals()}<div class="note">提示：数据保存在当前浏览器。更换设备请使用“导出数据备份 / 导入数据备份”，导入会覆盖本机现有数据。</div>`};const calendar=rs=>{let [y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay();let cells=Array.from({length:first},()=>'<div class="day blank"></div>');for(let i=1;i<=days;i++){let date=month+'-'+String(i).padStart(2,'0'),r=rs.filter(x=>x.date===date);cells.push(`<button class="day ${r.length?'has':''} ${date===selectedDay?'sel':''}" data-date="${date}"><b>${i}</b>${r.length?`<span class="amount">${money(total(r))}</span>`:''}</button>`)}return `<div class="panel"><div class="paneltop"><h2>${monthName(month)} · 工资日历</h2><span class="tiny">点击日期快捷录入</span></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div></div>`};const person=()=>{let s=staffBy(selected);if(!s){selected='overview';return overview()}let rs=monthRecords(s.id,month).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created),days=new Set(rs.map(x=>x.date));return `<div class="top"><div><h1>${esc(s.name)} <span style="font-size:16px;color:#a99acb">的工资</span></h1><p class="sub">按日期记录 · 月度自动结算</p></div><div class="actions">${monthInput()}${button(calendarMode?'▤ 月表':'▦ 日历','toggleCalendar')}${button('↓ 导出本月 PDF','pdf','primary')}</div></div><div class="cards">${stat('本月工资合计',money(total(rs)))}${stat('工资记录',rs.length+' 笔')}${stat('记录天数',days.size+' 天')}</div><div class="panel"><div class="paneltop"><h2>＋ 添加每日工资</h2><span class="tiny">同一天可添加多笔记录</span></div><form class="entry" id="entryForm"><div class="field"><label>日期</label><input id="entryDate" type="date" value="${selectedDay.startsWith(month)?selectedDay:month+'-01'}" required></div><div class="field"><label>工资金额（元）</label><input id="entryAmount" type="number" min="0.01" step="0.01" placeholder="例如 200.00" required></div><div class="field wide"><label>备注（可选）</label><input id="entryNote" maxlength="150" placeholder="例如 日薪 / 加班 / 补贴"></div><button class="btn primary" type="submit">添加记录</button></form></div>${calendarMode?calendar(rs):`<div class="panel"><div class="paneltop"><h2>${monthName(month)} · 工资明细月表</h2><span class="pill">${rs.length} 笔记录</span></div><div class="tablewrap"><table><thead><tr><th>日期</th><th>工资金额</th><th>备注</th><th>操作</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${r.date}</td><td class="money">${money(r.amount)}</td><td class="muted">${esc(r.note||'—')}</td><td><button class="btn small white" data-edit="${esc(r.id)}">修改</button> <button class="btn small danger" data-del="${esc(r.id)}">删除</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">本月暂无工资记录，填写上方表单即可添加。</td></tr>'}</tbody><tfoot><tr><td>本月合计</td><td>${money(total(rs))}</td><td colspan="2">${rs.length} 笔</td></tr></tfoot></table></div></div>`}`};const render=()=>{nav();$('#main').innerHTML=selected==='overview'?overview():person()};const modal=(title,body,buttons)=>{$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2>${body}<div class="modalfoot"><button class="btn white" id="cancelModal">取消</button>${buttons}</div></div></div>`;$('#cancelModal').onclick=closeModal};const closeModal=()=>$('#modalRoot').innerHTML='';const addStaff=()=>{modal('新增工作人员','<div class="field"><label>工作人员姓名</label><input id="staffName" maxlength="40" placeholder="请输入姓名"></div>','<button class="btn primary" id="confirmStaff">确定新增</button>');$('#confirmStaff').onclick=()=>{let name=$('#staffName').value.trim();if(!name)return alert('请输入姓名');let id=uid();db.staff.push({id,name});save();selected=id;closeModal();render()};$('#staffName').focus()};const staffMenu=id=>{let s=staffBy(id);if(!s)return;modal('管理工作人员',`<div class="field"><label>姓名</label><input id="staffName" maxlength="40" value="${esc(s.name)}"></div><p class="tiny">删除工作人员会同时删除其全部工资记录，无法撤销。</p>`,`<button class="btn danger" id="removeStaff">删除人员</button><button class="btn primary" id="renameStaff">保存姓名</button>`);$('#renameStaff').onclick=()=>{let n=$('#staffName').value.trim();if(!n)return alert('姓名不能为空');s.name=n;save();closeModal();render()};$('#removeStaff').onclick=()=>{if(!confirm(`确定永久删除“${s.name}”及其全部工资记录？建议先导出备份。`))return;db.staff=db.staff.filter(x=>x.id!==id);db.records=db.records.filter(x=>x.staffId!==id);if(selected===id)selected='overview';save();closeModal();render()}};const editRecord=id=>{let r=db.records.find(x=>x.id===id);if(!r)return;modal('修改工资记录',`<div class="field"><label>日期</label><input type="date" id="editDate" value="${r.date}"></div><div class="field"><label>金额（元）</label><input type="number" min="0.01" step="0.01" id="editAmount" value="${r.amount}"></div><div class="field"><label>备注</label><input id="editNote" maxlength="150" value="${esc(r.note||'')}"></div>`,'<button class="btn primary" id="saveEdit">保存修改</button>');$('#saveEdit').onclick=()=>{let date=$('#editDate').value,amt=Number($('#editAmount').value);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!validAmount(amt))return alert('请填写正确日期和最多两位小数的正金额');r.date=date;r.amount=amt;r.note=$('#editNote').value.trim();month=date.slice(0,7);save();closeModal();render()}};const download=(name,data,type)=>{let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};const exportBackup=()=>download('工资工作台备份_'+today()+'.json',JSON.stringify({app:'macaron-salary',version:3,exportedAt:new Date().toISOString(),staff:db.staff,records:db.records},null,2),'application/json;charset=utf-8');const importBackup=file=>{if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.staff)||!Array.isArray(data.records))throw Error('格式不正确');if(data.staff.length>10000||data.records.length>200000)throw Error('文件数据过大');let ids=new Set();for(let s of data.staff){if(typeof s.id!=='string'||typeof s.name!=='string'||s.name.length>100||ids.has(s.id))throw Error('人员数据异常');ids.add(s.id)}for(let r of data.records){if(typeof r.id!=='string'||!ids.has(r.staffId)||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!validAmount(Number(r.amount)))throw Error('工资记录异常')}if(!confirm('导入将覆盖本设备当前所有工作人员和工资记录，确定继续？'))return;db={staff:data.staff,records:data.records};selected='overview';save();render();alert('备份导入成功')}catch(e){alert('导入失败：'+e.message)}};reader.readAsText(file)};
const exportPDF=()=>{let s=staffBy(selected),rs=monthRecords(s.id,month).sort((a,b)=>a.date.localeCompare(b.date)),sum=total(rs);let rows=rs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.date}</td><td>${esc(r.note||'—')}</td><td style="text-align:right">${money(r.amount)}</td></tr>`).join('');let html=`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>${esc(s.name)}_${month}_工资月表</title><style>@page{size:A4;margin:18mm}body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#334155;padding:12px}h1{font-size:23px;margin:0 0 10px}.info{color:#64748b;margin-bottom:22px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #cbd5e1;padding:10px 9px;text-align:left;word-break:break-word}th{background:#eee8ff}tfoot td{background:#e5f6ed;font-weight:700}.hint{font-size:11px;color:#64748b;margin-top:22px}@media print{.toolbar{display:none!important}body{padding:0}thead{display:table-header-group}tr{break-inside:avoid}}</style></head><body><div class="toolbar" style="margin-bottom:25px;background:#fff2d9;padding:12px;border-radius:8px">点击 <button onclick="window.print()">打印 / 保存为 PDF</button>，在打印目标中选择“另存为 PDF”。</div><h1>工作人员工资月表</h1><div class="info">姓名：${esc(s.name)}　　月份：${monthName(month)}　　记录数：${rs.length} 笔</div><table><thead><tr><th>序号</th><th>日期</th><th>备注</th><th style="text-align:right">工资金额</th></tr></thead><tbody>${rows||'<tr><td colspan="4">本月暂无记录</td></tr>'}</tbody><tfoot><tr><td colspan="3">本月工资合计</td><td style="text-align:right">${money(sum)}</td></tr></tfoot></table><div class="hint">生成日期：${today()}　·　工资管理工作台</div></body></html>`;let w=window.open('','_blank');if(!w){alert('浏览器阻止了打印窗口，请允许弹出窗口后重试。');return}w.document.open();w.document.write(html);w.document.close();w.focus()};
$('#openNav').onclick=()=>$('#sidebar').classList.add('open');$('#addStaff').onclick=addStaff;$('#exportBackup').onclick=exportBackup;$('#importBackup').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=e=>{importBackup(e.target.files[0]);e.target.value=''};$('#nav').addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.view){selected=t.dataset.view;calendarMode=false;closeNav();render()}else if(t.dataset.cal){selected=t.dataset.cal;calendarMode=true;closeNav();render();$('#monthPick')?.focus()}else if(t.dataset.menu){staffMenu(t.dataset.menu)}});$('#main').addEventListener('change',e=>{if(e.target.id==='monthPick'){month=e.target.value||currentMonth();selectedDay=month+'-01';render()}});$('#main').addEventListener('submit',e=>{if(e.target.id!=='entryForm')return;e.preventDefault();let date=$('#entryDate').value,amount=Number($('#entryAmount').value),note=$('#entryNote').value.trim();if(!date||!validAmount(amount))return alert('请填写有效日期和最多两位小数的正金额');db.records.push({id:uid(),staffId:selected,date,amount,note,created:Date.now()});month=date.slice(0,7);selectedDay=date;save();render()});$('#main').addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.view){selected=t.dataset.view;calendarMode=false;render()}else if(t.dataset.jump){month=t.dataset.jump;selected=t.dataset.person;calendarMode=false;render()}else if(t.dataset.date){selectedDay=t.dataset.date;calendarMode=false;render();$('#entryDate').value=selectedDay;$('#entryAmount').focus()}else if(t.dataset.edit){editRecord(t.dataset.edit)}else if(t.dataset.del){let r=db.records.find(x=>x.id===t.dataset.del);if(r&&confirm(`删除 ${r.date} 的工资记录 ${money(r.amount)}？`)){db.records=db.records.filter(x=>x.id!==r.id);save();render()}}else if(t.dataset.act==='toggleCalendar'){calendarMode=!calendarMode;render()}else if(t.dataset.act==='pdf'){exportPDF()}});$('#modalRoot').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();})();
